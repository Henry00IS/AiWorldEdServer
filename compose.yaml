# Runs the relay on the server. Secrets come from ./.env (chmod 600, never committed).
services:
  relay:
    build: .
    image: aiworlded-server:latest
    container_name: aiworlded-server
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: '8081'
    # Published only on the private interface the reverse proxy forwards to.
    # Docker-published ports bypass the host INPUT chain, so binding to the
    # private address (not 0.0.0.0) is what keeps 8081 off the public internet.
    ports:
      - '${BIND_ADDRESS:?set BIND_ADDRESS in .env}:8081:8081'
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 256
    ulimits:
      nofile:
        soft: 8192
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:8081/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
